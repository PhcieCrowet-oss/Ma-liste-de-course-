<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Liste de Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .modal-overlay { background: rgba(0,0,0,0.5); }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tabs { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; }
        @media (min-width: 1024px) {
            .tabs { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="app" class="w-screen h-screen overflow-hidden flex flex-col bg-white"></div>

    <script>
        // === CONFIG FIREBASE ===
        let CATEGORIES_DB = {
            'Fruits': { icon: '🍎' },
            'Légumes': { icon: '🥕' },
            'Produits laitiers': { icon: '🧀' },
            'Protéines': { icon: '🥩' },
            'Féculents': { icon: '🥔' },
            'Basiques': { icon: '🧂' },
            'Surgelés': { icon: '🧊' },
            'Divers': { icon: '🛍️' }
        };

        let PRODUCTS_DB = {};

        const firebaseConfig = {
            apiKey: "AIzaSyCol3oPOehiRL6wmcjs6ntrZ8k4qaaJJYc",
            authDomain: "ma-liste-courses.firebaseapp.com",
            databaseURL: "https://ma-liste-courses-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ma-liste-courses",
            storageBucket: "ma-liste-courses.firebasestorage.app",
            messagingSenderId: "312232350580",
            appId: "1:312232350580:web:faec3e5e34b85c12f89221"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        class App {
            constructor() {
                this.items = [];
                this.userName = 'Vous';
                this.currentUser = null;
                this.isLoading = true;
                this.activeTab = 'list';
                this.isProcessing = false;
                this.modal = null;

                this.setupAuth();
                this.render();
            }

            setupAuth() {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        this.currentUser = user;
                        this.loadData();
                    } else {
                        this.showAuth();
                    }
                    this.isLoading = false;
                });
            }

            async loadData() {
                try {
                    const local = localStorage.getItem(`app_${this.currentUser.uid}`);
                    if (local) {
                        const data = JSON.parse(local);
                        this.items = data.items || [];
                        Object.assign(CATEGORIES_DB, data.categories || {});
                        Object.assign(PRODUCTS_DB, data.products || {});
                        this.userName = data.userName || this.userName;
                    }

                    const snap = await database.ref('users/' + this.currentUser.uid).once('value');
                    const fbData = snap.val();
                    if (fbData) {
                        this.items = fbData.items || [];
                        Object.assign(CATEGORIES_DB, fbData.categories || {});
                        Object.assign(PRODUCTS_DB, fbData.products || {});
                        this.userName = fbData.userName || this.userName;
                        this.render();
                    } else if (!local) {
                        await this.initData();
                    }

                    database.ref('users/' + this.currentUser.uid).on('value', (snap) => {
                        const fbData = snap.val();
                        if (fbData) {
                            this.items = fbData.items || [];
                            Object.assign(CATEGORIES_DB, fbData.categories || {});
                            Object.assign(PRODUCTS_DB, fbData.products || {});
                            this.userName = fbData.userName || this.userName;
                            this.render();
                        }
                    });
                } catch (e) { console.error(e); }
            }

            async initData() {
                const data = { items: [], categories: CATEGORIES_DB, products: PRODUCTS_DB, userName: this.userName };
                localStorage.setItem(`app_${this.currentUser.uid}`, JSON.stringify(data));
                try { await database.ref('users/' + this.currentUser.uid).set(data); } catch (e) {}
            }

            async save() {
                const data = { items: this.items, categories: CATEGORIES_DB, products: PRODUCTS_DB, userName: this.userName };
                localStorage.setItem(`app_${this.currentUser.uid}`, JSON.stringify(data));
                try { await database.ref('users/' + this.currentUser.uid).set(data); } catch (e) {}
            }

            // === ITEMS ===
            addItem(product) {
                if (this.isProcessing) return;
                this.isProcessing = true;
                this.items.push({
                    id: Date.now(),
                    productId: product.id,
                    name: product.name,
                    emoji: product.emoji,
                    category: product.category,
                    qty: 1,
                    unit: 'pièce',
                    notes: '',
                    done: false
                });
                this.save();
                this.render();
                setTimeout(() => { this.isProcessing = false; }, 300);
            }

            deleteItem(id) {
                this.items = this.items.filter(i => i.id !== id);
                this.save();
                this.render();
            }

            toggleItem(id) {
                const item = this.items.find(i => i.id === id);
                if (item) item.done = !item.done;
                this.save();
                this.render();
            }

            updateQty(id, qty) {
                const item = this.items.find(i => i.id === id);
                if (item && qty > 0) item.qty = qty;
                this.save();
                this.render();
            }

            updateUnit(id, unit) {
                const item = this.items.find(i => i.id === id);
                if (item) item.unit = unit;
                this.save();
                this.render();
            }

            updateNotes(id, notes) {
                const item = this.items.find(i => i.id === id);
                if (item) item.notes = notes;
                this.save();
            }

            increaseQty(id) { this.updateQty(id, (this.items.find(i => i.id === id)?.qty || 1) + 1); }
            decreaseQty(id) { const q = this.items.find(i => i.id === id)?.qty || 1; if (q > 1) this.updateQty(id, q - 1); }

            // === CATEGORIES ===
            addCategory() {
                const name = prompt('Nom de la catégorie:');
                const icon = prompt('Emoji (ex: 🍎):') || '📦';
                if (name && !CATEGORIES_DB[name]) {
                    CATEGORIES_DB[name] = { icon };
                    PRODUCTS_DB[name] = [];
                    this.save();
                }
            }

            editCategory(oldName) {
                const newName = prompt('Nouveau nom:', oldName);
                const newIcon = prompt('Emoji:', CATEGORIES_DB[oldName].icon);
                if (newName && newName !== oldName) {
                    CATEGORIES_DB[newName] = CATEGORIES_DB[oldName];
                    delete CATEGORIES_DB[oldName];
                    if (PRODUCTS_DB[oldName]) {
                        PRODUCTS_DB[newName] = PRODUCTS_DB[oldName];
                        delete PRODUCTS_DB[oldName];
                    }
                    this.items.forEach(i => { if (i.category === oldName) i.category = newName; });
                    this.save();
                } else if (newIcon) {
                    CATEGORIES_DB[oldName].icon = newIcon;
                    this.save();
                }
            }

            deleteCategory(name) {
                if (confirm(`Supprimer "${name}" ?`)) {
                    delete CATEGORIES_DB[name];
                    delete PRODUCTS_DB[name];
                    this.items = this.items.filter(i => i.category !== name);
                    this.save();
                }
            }

            // === PRODUCTS ===
            addProduct(catName) {
                const name = prompt('Nom du produit:');
                const emoji = prompt('Emoji:') || '📦';
                if (name) {
                    if (!PRODUCTS_DB[catName]) PRODUCTS_DB[catName] = [];
                    PRODUCTS_DB[catName].push({ id: 'p_' + Date.now(), name, emoji, category: catName });
                    this.save();
                }
            }

            editProduct(catName, prodId) {
                const prod = PRODUCTS_DB[catName]?.find(p => p.id === prodId);
                if (!prod) return;
                const name = prompt('Nom:', prod.name);
                const emoji = prompt('Emoji:', prod.emoji);
                if (name) prod.name = name;
                if (emoji) prod.emoji = emoji;
                this.save();
            }

            deleteProduct(catName, prodId) {
                if (confirm('Supprimer ce produit ?')) {
                    PRODUCTS_DB[catName] = PRODUCTS_DB[catName]?.filter(p => p.id !== prodId);
                    this.items = this.items.filter(i => i.productId !== prodId);
                    this.save();
                }
            }

            render() {
                if (this.isLoading) {
                    document.getElementById('app').innerHTML = `<div class="flex items-center justify-center w-full h-full"><div class="text-center"><div class="text-4xl spinner">⏳</div></div></div>`;
                    return;
                }

                const completedCount = this.items.filter(i => i.done).length;
                const categories = Object.keys(CATEGORIES_DB);

                let modal = '';
                if (this.modal?.type === 'categoryProducts') {
                    const cat = this.modal.category;
                    const prods = PRODUCTS_DB[cat] || [];
                    modal = `
                        <div class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-lg shadow-xl max-w-md w-full slide-in">
                                <div class="sticky top-0 bg-white border-b p-4 flex justify-between">
                                    <h2 class="text-xl font-bold">${CATEGORIES_DB[cat].icon} ${cat}</h2>
                                    <button onclick="app.modal=null;app.render()" class="text-2xl">×</button>
                                </div>
                                <div class="p-4 max-h-96 overflow-y-auto">
                                    ${prods.length === 0 ? '<p class="text-slate-500">Aucun produit</p>' : `<div class="grid grid-cols-2 gap-2">${prods.map(p => `<button onclick="app.addItem({id:'${p.id}',name:'${p.name}',emoji:'${p.emoji}',category:'${p.category}'});app.modal=null;app.render()" class="p-3 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded"><div class="text-2xl">${p.emoji}</div><div class="text-xs font-medium text-center">${p.name}</div></button>`).join('')}</div>`}
                                </div>
                            </div>
                        </div>
                    `;
                }

                const html = `
                    <div class="lg:hidden tabs">
                        <button onclick="app.activeTab='list';app.render()" class="tab-btn ${this.activeTab === 'list' ? 'active' : ''}">📝 Liste</button>
                        <button onclick="app.activeTab='cats';app.render()" class="tab-btn ${this.activeTab === 'cats' ? 'active' : ''}">📂 Catégories</button>
                    </div>

                    <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        <!-- Catégories -->
                        <div class="lg:w-96 lg:border-r lg:overflow-y-auto ${this.activeTab === 'cats' ? 'block' : 'hidden lg:block'} overflow-y-auto p-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-bold">📂 Catégories</h2>
                                <button onclick="app.addCategory()" class="px-3 py-1 bg-green-500 hover:bg-green-600 text-white text-sm rounded">+</button>
                            </div>

                            <!-- Menu déroulant des catégories -->
                            <div class="mb-4">
                                <select id="catSelect" onchange="if(this.value) { document.getElementById('catDetails').style.display='block'; document.getElementById('catDetailsContent').innerHTML = document.getElementById('cat_'+this.value).innerHTML; }" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                                    <option value="">-- Sélectionner une catégorie --</option>
                                    ${categories.map(cat => `<option value="${cat}">${CATEGORIES_DB[cat].icon} ${cat}</option>`).join('')}
                                </select>
                            </div>

                            <!-- Détails de la catégorie sélectionnée -->
                            <div id="catDetails" style="display:none;">
                                <div id="catDetailsContent"></div>
                            </div>

                            <!-- Catégories cachées (pour remplir le contenu du déroulant) -->
                            <div style="display:none;">
                                ${categories.map(cat => `
                                    <div id="cat_${cat}">
                                        <div class="flex items-center justify-between mb-3 pb-3 border-b">
                                            <h3 class="text-lg font-bold">${CATEGORIES_DB[cat].icon} ${cat}</h3>
                                            <div class="flex gap-1">
                                                <button onclick="app.editCategory('${cat}')" class="px-2 py-1 bg-blue-500 hover:bg-blue-600 text-white text-xs rounded">✏️</button>
                                                <button onclick="app.deleteCategory('${cat}')" class="px-2 py-1 bg-red-500 hover:bg-red-600 text-white text-xs rounded">🗑️</button>
                                            </div>
                                        </div>
                                        <button onclick="app.addProduct('${cat}')" class="w-full px-2 py-1 bg-green-100 hover:bg-green-200 text-green-700 text-xs rounded mb-3">+ Produit</button>
                                        ${PRODUCTS_DB[cat] && PRODUCTS_DB[cat].length > 0 ? `
                                            <div class="space-y-2">
                                                ${PRODUCTS_DB[cat].map(p => `
                                                    <div class="flex items-center justify-between bg-slate-50 p-2 rounded text-xs">
                                                        <span>${p.emoji} ${p.name}</span>
                                                        <div class="flex gap-1">
                                                            <button onclick="app.editProduct('${cat}','${p.id}')" class="px-1 py-0 bg-blue-500 hover:bg-blue-600 text-white rounded">✏️</button>
                                                            <button onclick="app.deleteProduct('${cat}','${p.id}')" class="px-1 py-0 bg-red-500 hover:bg-red-600 text-white rounded">🗑️</button>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        ` : '<p class="text-xs text-slate-500">Aucun produit</p>'}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Liste -->
                        <div class="flex-1 overflow-y-auto ${this.activeTab === 'list' ? 'block' : 'hidden lg:block'} p-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-bold">📝 Ma Liste</h2>
                                <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">${completedCount}/${this.items.length}</span>
                            </div>

                            ${this.items.length === 0 ? '<p class="text-center text-slate-500 py-8">Liste vide</p>' : `
                                <!-- Articles non cochés -->
                                <div class="space-y-3 mb-6">
                                    ${this.items.filter(i => !i.done).map(item => `
                                        <div class="p-3 bg-white border border-slate-200 rounded-lg">
                                            <div class="flex items-center gap-2 mb-2">
                                                <input type="checkbox" onchange="app.toggleItem(${item.id})" class="w-5 h-5 cursor-pointer">
                                                <div class="flex-1">
                                                    <div class="font-semibold text-slate-900">${item.emoji} ${item.name}</div>
                                                    <div class="text-xs text-slate-500">${item.category}</div>
                                                </div>
                                                <button onclick="app.deleteItem(${item.id})" class="px-2 py-1 bg-red-100 hover:bg-red-200 text-red-600 text-sm rounded">🗑️</button>
                                            </div>
                                            <div class="flex items-center gap-2 mb-2 flex-wrap">
                                                <button onclick="app.decreaseQty(${item.id})" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-sm rounded">−</button>
                                                <input type="number" value="${item.qty}" min="1" onchange="app.updateQty(${item.id},parseInt(this.value))" class="w-16 text-center border border-slate-300 rounded px-1 text-sm">
                                                <button onclick="app.increaseQty(${item.id})" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-sm rounded">+</button>
                                                <select onchange="app.updateUnit(${item.id},this.value)" class="border border-slate-300 rounded px-2 text-sm">
                                                    <option value="pièce" ${item.unit === 'pièce' ? 'selected' : ''}>pièce</option>
                                                    <option value="g" ${item.unit === 'g' ? 'selected' : ''}>g</option>
                                                    <option value="kg" ${item.unit === 'kg' ? 'selected' : ''}>kg</option>
                                                    <option value="ml" ${item.unit === 'ml' ? 'selected' : ''}>ml</option>
                                                    <option value="L" ${item.unit === 'L' ? 'selected' : ''}>L</option>
                                                </select>
                                            </div>
                                            <input type="text" placeholder="Commentaire..." value="${item.notes}" onchange="app.updateNotes(${item.id},this.value)" class="w-full px-2 py-1 border border-slate-300 rounded text-sm" style="font-size: 14px;">
                                        </div>
                                    `).join('')}
                                </div>

                                <!-- Articles cochés -->
                                ${this.items.filter(i => i.done).length > 0 ? `
                                    <div class="border-t-2 pt-4">
                                        <h3 class="font-bold mb-3">✅ Articles récoltés</h3>
                                        <div class="space-y-2 opacity-60">
                                            ${this.items.filter(i => i.done).map(item => `
                                                <div class="flex items-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-lg line-through">
                                                    <input type="checkbox" checked onchange="app.toggleItem(${item.id})" class="w-5 h-5 cursor-pointer">
                                                    <div class="flex-1">
                                                        <div class="text-slate-700">${item.emoji} ${item.name}</div>
                                                    </div>
                                                    <button onclick="app.deleteItem(${item.id})" class="px-2 py-1 bg-red-100 hover:bg-red-200 text-red-600 text-sm rounded">🗑️</button>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            `}
                        </div>
                    </div>

                    ${modal}
                `;

                document.getElementById('app').innerHTML = html;
            }

            showAuth() {
                document.getElementById('app').innerHTML = `
                    <div class="flex items-center justify-center w-full h-full bg-gradient-to-br from-blue-50 to-indigo-50">
                        <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full">
                            <h1 class="text-3xl font-bold text-center mb-8">🛒 Ma Liste</h1>
                            <div class="space-y-4">
                                <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border border-slate-300 rounded-lg">
                                <input type="password" id="pwd" placeholder="Mot de passe" class="w-full px-4 py-2 border border-slate-300 rounded-lg">
                                <button onclick="auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('pwd').value).catch(e=>alert(e.message))" class="w-full px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-semibold">Se connecter</button>
                                <button onclick="auth.createUserWithEmailAndPassword(document.getElementById('email').value,document.getElementById('pwd').value).catch(e=>alert(e.message))" class="w-full px-4 py-2 bg-slate-300 hover:bg-slate-400 text-slate-900 rounded-lg font-semibold">Créer un compte</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new App();
        });
    </script>
</body>
</html>
